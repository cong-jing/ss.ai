name: CI and Deploy to Lightsail

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target environment
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  deploy:
    name: Deploy ${{ github.event_name == 'push' && 'staging' || inputs.target }} to Lightsail
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
    concurrency:
      group: lightsail-${{ github.event_name == 'push' && 'staging' || inputs.target }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
      LIGHTSAIL_USER: ubuntu
      LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      LIGHTSAIL_DEFAULT_API_KEY: ${{ secrets.LIGHTSAIL_DEFAULT_API_KEY }}
      LIGHTSAIL_DEPLOY_BASE: ${{ vars.LIGHTSAIL_DEPLOY_BASE }}
      LIGHTSAIL_SERVICE_NAME: ss-ai-${{ github.event_name == 'push' && 'staging' || inputs.target }}
      LIGHTSAIL_HOST: 13.159.36.248
      LIGHTSAIL_SSH_PORT: 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deploy bundle
        run: pnpm run deploy:${TARGET_ENV}

      - name: Pack release archive
        run: |
          tar -C ".deploy-${TARGET_ENV}" -czf "ss-ai-${TARGET_ENV}-${GITHUB_SHA}.tgz" .
          ls -lh "ss-ai-${TARGET_ENV}-${GITHUB_SHA}.tgz"

      - name: Validate deploy settings
        run: |
          test -n "$LIGHTSAIL_USER"
          test -n "$LIGHTSAIL_SSH_KEY"
          test -n "$LIGHTSAIL_DEFAULT_API_KEY"
          test -n "$LIGHTSAIL_DEPLOY_BASE"
          test "$LIGHTSAIL_HOST" = "13.159.36.248"
          test "$LIGHTSAIL_SSH_PORT" = "22"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$LIGHTSAIL_SSH_KEY" \
            | perl -0pe 's/\r\n/\n/g; s/\r/\n/g; s/\\n/\n/g' \
            > ~/.ssh/lightsail.key
          chmod 600 ~/.ssh/lightsail.key
          ssh-keygen -y -f ~/.ssh/lightsail.key > /dev/null
          cp .github/known_hosts/lightsail ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release archive
        run: |
          scp -P "${LIGHTSAIL_SSH_PORT:-22}" -i ~/.ssh/lightsail.key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "ss-ai-${TARGET_ENV}-${GITHUB_SHA}.tgz" \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}:/tmp/ss-ai-${TARGET_ENV}-${GITHUB_SHA}.tgz"

      - name: Upload activate script
        run: |
          scp -P "${LIGHTSAIL_SSH_PORT:-22}" -i ~/.ssh/lightsail.key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "scripts/activate-lightsail-release.mjs" \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}:/tmp/ss-ai-activate-release-${GITHUB_SHA}.mjs"

      # Use a mounted filesystem path such as /opt/ss-ai/staging here.
      # The block device name /dev/sda1 is not used by GitHub Actions directly.
      - name: Activate release on Lightsail
        run: |
          ssh -p "${LIGHTSAIL_SSH_PORT:-22}" -i ~/.ssh/lightsail.key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}" \
            bash -s -- "/tmp/ss-ai-activate-release-${GITHUB_SHA}.mjs" "${LIGHTSAIL_DEPLOY_BASE}" "${LIGHTSAIL_SERVICE_NAME}" "${GITHUB_SHA}" "${TARGET_ENV}" "${LIGHTSAIL_DEFAULT_API_KEY}" <<'EOF'
          set -euo pipefail
          SCRIPT_PATH="$1"
          DEPLOY_BASE="$2"
          SERVICE_NAME="$3"
          RELEASE_SHA="$4"
          TARGET_ENV="$5"
          DEFAULT_API_KEY="$6"

          # Pass plaintext API key secret to release activation script.
          node "$SCRIPT_PATH" "$DEPLOY_BASE" "$SERVICE_NAME" "$RELEASE_SHA" "$TARGET_ENV" "$DEFAULT_API_KEY"
          rm -f "$SCRIPT_PATH"
          EOF
