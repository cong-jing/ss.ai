name: CI and Deploy to Lightsail

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target environment
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  deploy:
    name: Deploy ${{ inputs.target }} to Lightsail
    if: github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    concurrency:
      group: lightsail-${{ inputs.target }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ inputs.target }}
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
      LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      LIGHTSAIL_DEPLOY_BASE: ${{ vars.LIGHTSAIL_DEPLOY_BASE }}
      LIGHTSAIL_RELEASES_TO_KEEP: ${{ vars.LIGHTSAIL_RELEASES_TO_KEEP }}
      LIGHTSAIL_SERVICE_NAME: ${{ vars.LIGHTSAIL_SERVICE_NAME }}
      LIGHTSAIL_SSH_PORT: ${{ vars.LIGHTSAIL_SSH_PORT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deploy bundle
        run: pnpm run deploy:${TARGET_ENV}

      - name: Pack release archive
        run: |
          tar -C ".deploy-${TARGET_ENV}" -czf "ss-ai-${TARGET_ENV}-${GITHUB_SHA}.tgz" .
          ls -lh "ss-ai-${TARGET_ENV}-${GITHUB_SHA}.tgz"

      - name: Validate deploy settings
        run: |
          test -n "$LIGHTSAIL_HOST"
          test -n "$LIGHTSAIL_USER"
          test -n "$LIGHTSAIL_SSH_KEY"
          test -n "$LIGHTSAIL_DEPLOY_BASE"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail.key
          chmod 600 ~/.ssh/lightsail.key
          cp .github/known_hosts/lightsail ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release archive
        run: |
          scp -P "${LIGHTSAIL_SSH_PORT:-22}" -i ~/.ssh/lightsail.key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "ss-ai-${TARGET_ENV}-${GITHUB_SHA}.tgz" \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}:/tmp/ss-ai-${TARGET_ENV}-${GITHUB_SHA}.tgz"

      # Use a mounted filesystem path such as /opt/ss-ai/staging here.
      # The block device name /dev/sda1 is not used by GitHub Actions directly.
      - name: Activate release on Lightsail
        run: |
          ssh -p "${LIGHTSAIL_SSH_PORT:-22}" -i ~/.ssh/lightsail.key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}" \
            "DEPLOY_BASE='${LIGHTSAIL_DEPLOY_BASE}' RELEASES_TO_KEEP='${LIGHTSAIL_RELEASES_TO_KEEP:-5}' SERVICE_NAME='${LIGHTSAIL_SERVICE_NAME}' RELEASE_SHA='${GITHUB_SHA}' TARGET_ENV='${TARGET_ENV}' bash -s" <<'EOF'
          set -euo pipefail

          RELEASES_DIR="$DEPLOY_BASE/releases"
          RELEASE_DIR="$RELEASES_DIR/$RELEASE_SHA"
          CURRENT_LINK="$DEPLOY_BASE/current"
          SHARED_RUNTIME_DIR="$DEPLOY_BASE/shared/runtime"
          ARCHIVE_PATH="/tmp/ss-ai-$TARGET_ENV-$RELEASE_SHA.tgz"

          case "$RELEASES_TO_KEEP" in
            ''|*[!0-9]*)
              echo "RELEASES_TO_KEEP must be a positive integer, got: $RELEASES_TO_KEEP" >&2
              exit 1
              ;;
          esac

          if [ "$RELEASES_TO_KEEP" -lt 1 ]; then
            echo "RELEASES_TO_KEEP must be at least 1, got: $RELEASES_TO_KEEP" >&2
            exit 1
          fi

          mkdir -p "$RELEASES_DIR" "$SHARED_RUNTIME_DIR"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          tar -xzf "$ARCHIVE_PATH" -C "$RELEASE_DIR"

          rm -rf "$RELEASE_DIR/server/.runtime"
          ln -sfn "$SHARED_RUNTIME_DIR" "$RELEASE_DIR/server/.runtime"
          ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

          rm -f "$ARCHIVE_PATH"

          if [ -n "${SERVICE_NAME:-}" ]; then
            sudo systemctl restart "$SERVICE_NAME"
            sudo systemctl --no-pager --full status "$SERVICE_NAME" | sed -n '1,20p'
          fi

          OLD_RELEASES="$(find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d ! -path "$RELEASE_DIR" -printf '%T@ %p\n' | sort -nr | awk -v keep="$((RELEASES_TO_KEEP - 1))" 'NR > keep { print $2 }')"

          if [ -n "$OLD_RELEASES" ]; then
            printf '%s\n' "$OLD_RELEASES" | while IFS= read -r old_release; do
              [ -n "$old_release" ] || continue
              rm -rf "$old_release"
            done
          fi
          EOF
