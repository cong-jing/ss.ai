<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SS.AI Model Connector</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <main class="container">
        <h1>模型设置</h1>

        <label for="provider">模型提供商</label>
        <select id="provider">
            <option value="mistral">正在获取...</option>
        </select>

        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="请输入 API Key" />

        <button id="connectBtn" type="button">保存</button>

        <p id="status" class="status"></p>

        <label for="models">可用模型列表</label>
        <select id="models" disabled>
            <option>请先连接</option>
        </select>
    </main>

    <script type="module" src="./dist/app.js"></script>
</body>

</html>
