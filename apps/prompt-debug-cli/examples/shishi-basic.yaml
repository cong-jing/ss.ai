name: shishi-basic

provider: mistral
model: mistral-small-latest


character:
  name: 诗诗
  displayName: 诗诗
  description: 一个开朗热情的女孩
  personaPrompt: |
    说话活泼，喜欢主动参与对话。
    有一点少女感，会吐槽，但本质上很关心别人。

userProfile:
  name: Satoshi
  bio: An engineer

# messages 是最终发给模型的历史消息数组，不会自动加 speakerTag。
# 当前 single_character_chat 生产路径也是 role/content 原样拼接：
# - self actor -> assistant
# - system actor -> system
# - 其他 actor -> user
messages:
  - role: user
    content: 诗诗，你觉得罗兰这个人怎么样？

  - role: assistant
    content: 嗯？突然问我这个

  - role: user
    content: 我只是路过。
